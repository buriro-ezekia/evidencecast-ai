# Deploys EvidenceCast as separate FastAPI and Streamlit web services on Render.
services:
  - type: web
    name: evidencecast-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: EVIDENCECAST_FIXTURE_MODE
        value: "1"
      - key: EVIDENCECAST_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: evidencecast-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: EVIDENCECAST_FIXTURE_MODE
        value: "1"
      - key: EVIDENCECAST_API_URL
        fromService:
          type: web
          name: evidencecast-api
          property: hostport
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        value: us-east-005
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_IMAGE_MODEL
        value: stabilityai/stable-diffusion-3-5-large
      - key: NVIDIA_AUDIO_MODEL
        value: nvidia/magpie-tts-multilingual
      - key: NVIDIA_TTS_VOICE
        value: Magpie-Multilingual.EN-US.Aria
      - key: NVIDIA_TTS_ENDPOINT
        value: https://877104f7-e885-42b9-8de8-f6e4c6303969.invocation.api.nvcf.nvidia.com/v1/audio/synthesize
