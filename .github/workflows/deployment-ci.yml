# Tests the complete suite, builds both deployment images and verifies the public services.
name: Deployment CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all tests
        env:
          EVIDENCECAST_FIXTURE_MODE: "1"
        run: pytest -q

  docker-builds:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "evidencecast-${{ matrix.name }}:ci" .

  public-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Allow Render auto-deploy to start
        run: sleep 180

      - name: Smoke-test public services
        id: smoke
        run: |
          set -o pipefail
          python scripts/smoke_test_deployment.py \
            --api-url https://evidencecast-api-buriro-2026.onrender.com \
            --web-url https://evidencecast-web-buriro-2026.onrender.com \
            --startup-timeout 300 \
            --retry-interval 5 \
            2>&1 | tee smoke-output.txt

      - name: Record smoke result in issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Automated public smoke test"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Outcome: **${SMOKE_OUTCOME}**"
            echo
            echo '```text'
            if [[ -f smoke-output.txt ]]; then
              cat smoke-output.txt
            else
              echo "Smoke test did not produce an output file."
            fi
            echo '```'
          } > smoke-comment.md
          gh issue comment 16 --body-file smoke-comment.md
