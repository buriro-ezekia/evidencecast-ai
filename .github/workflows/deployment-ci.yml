# Tests the complete suite and confirms both deployment images build without secrets.
name: Deployment CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deployment-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all tests
        env:
          EVIDENCECAST_FIXTURE_MODE: "1"
        run: pytest -q

  docker-builds:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "evidencecast-${{ matrix.name }}:ci" .
