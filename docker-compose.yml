# Runs the EvidenceCast Streamlit frontend and FastAPI backend as separate services.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    restart: unless-stopped
    environment:
      EVIDENCECAST_FIXTURE_MODE: "1"
      EVIDENCECAST_ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PYTHONPATH: "/app:/app/src"
      PORT: "8501"
      EVIDENCECAST_API_URL: "http://api:8000"
      EVIDENCECAST_FIXTURE_MODE: "1"
      B2_KEY_ID: "${B2_KEY_ID:-}"
      B2_APP_KEY: "${B2_APP_KEY:-}"
      B2_BUCKET: "${B2_BUCKET:-}"
      B2_REGION: "${B2_REGION:-us-east-005}"
      B2_ENDPOINT: "${B2_ENDPOINT:-https://s3.us-east-005.backblazeb2.com}"
      GMI_API_KEY: "${GMI_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_IMAGE_MODEL: "${NVIDIA_IMAGE_MODEL:-stabilityai/stable-diffusion-3-5-large}"
      NVIDIA_AUDIO_MODEL: "${NVIDIA_AUDIO_MODEL:-nvidia/magpie-tts-multilingual}"
      NVIDIA_TTS_VOICE: "${NVIDIA_TTS_VOICE:-Magpie-Multilingual.EN-US.Aria}"
      NVIDIA_TTS_ENDPOINT: "${NVIDIA_TTS_ENDPOINT:-https://877104f7-e885-42b9-8de8-f6e4c6303969.invocation.api.nvcf.nvidia.com/v1/audio/synthesize}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
